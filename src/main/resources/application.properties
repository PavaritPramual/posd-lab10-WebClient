spring.application.name=lab10-webflux

# Port — เปลี่ยนได้ถ้า 8080 ถูกใช้งานอยู่
server.port=8080

# Product API base URL used by ProductWebClient
product.api.base-url=http://localhost:${server.port}

# Logging
logging.level.root=INFO
logging.level.com.example.lab10=DEBUG
logging.level.reactor.netty=INFO
